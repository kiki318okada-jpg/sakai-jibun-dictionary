<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>進行者画面｜ジブン辞典</title><link rel="stylesheet" href="style.css"><style>.metric{font-size:52px;font-weight:900}.row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid #eee}.count{font-size:26px;font-weight:900}.error{color:#b42318}</style></head><body><header><b>FACILITATOR DASHBOARD</b></header><main><div class=k>WORK 01｜LIVE RESULT</div><h1>みんなが選んだ<br>「なぜか気になる人」</h1><div class=card><b>回答受付中</b><div class=metric id=total>--</div><div class=hint>回答数 / 最大 <span id=max></span> 名</div></div><div id=rows></div><p class=hint id=updated></p><p class=error id=err></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src=config.js></script><script src=supabase-client.js></script><script>initSupabase();document.querySelector("#max").textContent=JIBUN_CONFIG.maxParticipants;async function refresh(){try{const x=await getSummary();document.querySelector("#total").textContent=x.total;document.querySelector("#rows").innerHTML=x.choices.map(r=>'<div class=row><b>'+r.person+'</b><span class=count>'+r.count+'人</span></div>').join("");document.querySelector("#updated").textContent="最終更新 "+new Date().toLocaleTimeString();document.querySelector("#err").textContent=""}catch(e){document.querySelector("#err").textContent="集計を取得できません: "+e.message}}refresh();setInterval(refresh,2000)</script></body></html>
